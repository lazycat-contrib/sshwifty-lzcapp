version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: sshwifty
build:
  toolchains: []
  run_buildscript: false
images:
  - id: sshwifty
    target: service
    service: sshwifty
    source: niruix/sshwifty
    channel: custom
    sort: semver
    tag_regex: ^0[.][0-9]+[.][0-9]+-beta-release$
    version_regex: ^(?P<version>0[.][0-9]+[.][0-9]+)-beta-release$
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: sshwifty
    skip_if_version_exists: true
